<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Make LLM output read like a well-set book. Streaming markdown, agent turns, and diffs, typeset with the Knuth-Plass algorithm." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>output: typeset LLM output</title>
    <script>
      try {
        var s = localStorage.getItem("docs-scheme");
        if (!s) s = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.scheme = s;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
